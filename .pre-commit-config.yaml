# Instalar una vez con:  pre-commit install
#
# El hook de gitleaks es el que no debe quitarse nunca: es la red de seguridad
# contra commitear un JWT_SECRET_KEY o un .env. Un secreto filtrado en el
# historial de git no se arregla con un commit, hay que rotarlo.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # Las fixtures de iptables son salidas literales: su espaciado ES el dato.
      # `iptables -L -v -n` rellena las columnas con espacios al final de cada
      # linea, y limpiarlos convertiria el test en una comprobacion contra un
      # formato que iptables no produce.
      #
      # El patron cubre los DOS juegos de fixtures (`iptables_output/` y
      # `iptables_output_1810/`). Con la ruta exacta del primero, las fixtures
      # de la 1.8.10 entraban al formateador en su primer commit y se les
      # borraban los espacios finales: el dato, corrompido por un hook de estilo.
      - id: trailing-whitespace
        exclude: ^backend/tests/fixtures/iptables_output[^/]*/.*\.txt$
      - id: end-of-file-fixer
        exclude: ^backend/tests/fixtures/iptables_output[^/]*/.*\.txt$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      # El tronco es `master` (2026-09-02). Se listan las dos ramas: `main` sigue
      # existiendo como historia vieja y tampoco se commitea directamente.
      - id: no-commit-to-branch
        args: ["--branch", "master", "--branch", "main"]

  # Esta version tiene que ser LA MISMA que la de backend/pyproject.toml. Si se
  # separan, `make lint` y `pre-commit` se reformatean el codigo el uno al otro
  # en cada commit: paso en A5 con 0.8.4 aqui y 0.16.3 en el venv.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^backend/app/
        additional_dependencies: [pydantic>=2.9, types-python-dateutil]

  # Misma regla que ruff, y por el mismo motivo: esta version tiene que coincidir
  # con la de backend/pyproject.toml. Con `>=1.8` en pyproject y 1.8.0 aqui, el
  # venv acabo en 1.9.4 y `make lint` empezo a fallar en codigo que nadie habia
  # tocado desde A4. Un linter sin pinear cambia de opinion solo.
  #
  # PERO el pin va en `rev` y SOLO en `rev`. bandit es un hook `language: python`
  # cuyo repo ES el paquete: pre-commit hace `pip install . bandit[toml]`, y ese
  # `.` es el clon del tag, que sin metadatos de git se declara version 0.0.0.
  # Añadir `bandit[toml]==1.9.4` le pide a pip un bandit DISTINTO del que esta
  # instalando desde el codigo, y la resolucion es imposible:
  #   ERROR: Cannot install bandit 0.0.0 (from ...) and bandit==1.9.4
  # El extra `[toml]` sin version es lo correcto: solo añade el lector de TOML
  # que hace falta para `-c backend/pyproject.toml`.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "backend/pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^backend/app/

  # gitleaks se invoca como binario del sistema, NO desde su repo de pre-commit.
  # El hook oficial es `language: golang`, asi que pre-commit se descarga un
  # toolchain de Go entero la primera vez; el 2026-09-01 eso reventó el commit de
  # A4 con un `SSL: UNEXPECTED_EOF_WHILE_READING` contra go.dev. El hook que no
  # debe faltar nunca no puede ser tambien el mas fragil de instalar.
  #
  # Requisito: `brew install gitleaks` (gratis, sin cuenta).
  # Si tu version es anterior a la 8.19, el subcomando es:
  #   gitleaks protect --staged --redact --verbose
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (secretos en lo que vas a commitear)
        entry: gitleaks git --pre-commit --staged --redact --verbose
        language: system
        pass_filenames: false
