[project]
name = "firewall-dashboard-backend"
version = "0.0.1"
description = "Backend FastAPI para la gestion de reglas de iptables con dashboard web."
# Sin `readme`: setuptools rechaza rutas fuera del directorio del proyecto
# (`../README.md` -> DistutilsOptionError). El README vive en la raiz del repo.
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "structlog>=24.4",
    # PyJWT y no python-jose: jose esta practicamente sin mantener y arrastra
    # CVEs conocidas (confusion de algoritmo y DoS al decodificar). En un
    # proyecto de seguridad, `pip-audit` marcando la libreria de auth seria un
    # mal chiste. Ver ADR-0008.
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Version exacta y no `>=`: el formateador de ruff cambia de estilo entre
    # versiones, y tiene que coincidir con la del hook de .pre-commit-config.yaml.
    "ruff==0.16.3",
    "mypy>=1.13",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --------------------------------------------------------------------------- #
# pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Por defecto se excluyen los tests que necesitan iptables real: asi `pytest` a
# secas funciona en el Mac (bloque A). Dentro de la VM: `pytest -m requires_iptables`.
addopts = "-m 'not requires_iptables' --strict-markers"
markers = [
    "requires_iptables: necesita iptables real y privilegios (solo dentro de la VM)",
    "contract: suite de contrato, se ejecuta contra los dos backends",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "\\.\\.\\.",
]

# --------------------------------------------------------------------------- #
# ruff
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "PTH",       # usar pathlib
    "RUF",
    "S",         # bandit: seguridad
]
ignore = [
    "S101",      # assert: legitimo en tests
    "E501",      # longitud de linea: la gestiona el formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N802"]
# El runner es el unico sitio donde subprocess esta permitido; su seguridad se
# verifica con tests dedicados, no con el linter.
"app/firewall/runner.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# --------------------------------------------------------------------------- #
# mypy — estricto en la capa critica
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "app.firewall.*"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --------------------------------------------------------------------------- #
# bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "alembic"]
